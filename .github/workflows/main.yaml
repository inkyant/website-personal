name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# only one deployment at a time, but don't cancel one that's in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-site:
    name: build astro site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # installs dependencies, builds, and uploads the site for github pages
      - name: Build
        uses: withastro/action@v6

  deploy:
    name: deploy to github pages
    # pull requests just check that the site builds
    if: github.event_name != 'pull_request'
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
